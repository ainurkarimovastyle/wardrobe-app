<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Гардероб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAEAEA;--card:#FFFFFF;--ink:#111111;--muted:#5E5E5E;--line:#CFCFCF;--chip:#DADADA;--soft:#F2F2F2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
img{display:block}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.round{width:44px;height:44px;border-radius:22px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.round.dark{background:var(--ink);color:#fff}
.avatar{font-size:13px;font-weight:500;letter-spacing:.02em}
.h1{margin:22px 0 0;font-size:52px;line-height:.95;font-weight:500;letter-spacing:-.045em}
.h1 .thin{font-weight:200}
.sub{margin:12px 0 0;font-size:14px;line-height:1.3;color:var(--muted)}
.stat{display:flex;align-items:flex-end;gap:10px;margin-top:24px}
.stat b{font-size:96px;line-height:.8;font-weight:200;letter-spacing:-.06em}
.stat small{font-size:13px;line-height:1.2;color:var(--muted);padding-bottom:4px}
.scroller{display:flex;gap:8px;overflow-x:auto;margin:24px -16px 0;padding:0 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.cover{flex:none;width:112px;border-radius:22px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.cover.on{background:var(--ink);color:#fff}
.cover .ph{width:96px;height:96px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover .ph img{width:100%;height:100%;object-fit:cover}
.cover .ph b{font-size:44px;font-weight:200;letter-spacing:-.05em;color:var(--ink)}
.cover .nm{padding:0 4px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .ct{padding:0 4px;font-size:11px;color:var(--muted);white-space:nowrap}
.cover.on .ct{color:#BDBDBD}
.pills{display:flex;gap:6px;overflow-x:auto;margin:24px -16px 0;padding:0 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill small{font-size:11px;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.card{background:var(--card);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;min-width:0;width:100%}
.card.sel{border-color:var(--ink)}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.card .img{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}
.card .img img{width:100%;height:100%;object-fit:contain}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta .c{font-size:11px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .t{font-size:15px;line-height:1.25;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .t.empty{color:#9A9A9A;font-weight:400}
.pick{height:42px;border-radius:21px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{width:100%;height:56px;border-radius:28px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);height:52px}
.btn.plain{background:transparent;color:var(--ink);height:48px}
.btn[disabled]{opacity:.5}
.hero{margin-top:20px;background:var(--card);border-radius:30px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:contain}
.kv{margin-top:18px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.label{margin:26px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{margin:6px 0 0;font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.looks{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.look{border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:16px;background:var(--card);width:100%}
.look.dark{background:var(--ink);color:#fff}
.look .hd{display:flex;justify-content:space-between;font-size:12px;line-height:1.3;color:var(--muted)}
.look.dark .hd{color:#A8A8A8}
.look .dots{display:flex;gap:6px;overflow:hidden}
.look .dot{width:74px;height:74px;border-radius:37px;background:var(--soft);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.look .dot img{width:100%;height:100%;object-fit:cover}
.look .nm{font-size:34px;line-height:1;font-weight:500;letter-spacing:-.04em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note{margin-top:20px;background:var(--ink);color:#fff;border-radius:24px;padding:18px 20px}
.note small{display:block;font-size:11px;color:#A8A8A8}
.note p{margin:6px 0 0;font-size:15px;line-height:1.4;white-space:pre-line}
.empty{margin-top:24px;background:var(--card);border-radius:24px;padding:28px 20px;font-size:15px;line-height:1.4;color:var(--muted);text-align:center}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;display:flex;gap:6px;padding:6px;border-radius:34px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:10}
.tab{flex:1;height:50px;border-radius:25px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:var(--ink);color:#fff}
.tab .bd{min-width:20px;height:20px;border-radius:10px;background:#fff;color:var(--ink);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;background:var(--ink);color:#fff;border-radius:34px;padding:10px 10px 10px 22px;display:flex;align-items:center;gap:14px;z-index:10}
.selbar small{display:block;font-size:11px;color:#A8A8A8}
.selbar b{display:block;font-size:30px;line-height:1;font-weight:200;letter-spacing:-.04em}
.selbar .th{display:flex;flex:1;min-width:0;padding-left:8px}
.selbar .th span{width:38px;height:38px;border-radius:19px;background:#F0F0F0;border:2px solid var(--ink);margin-left:-8px;overflow:hidden;flex:none}
.selbar .th img{width:100%;height:100%;object-fit:cover}
.selbar .go{height:52px;padding:0 24px;border-radius:26px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.selbar .go[disabled]{background:#2E2E2E;color:#8C8C8C}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:32px 32px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;z-index:21;max-height:90vh;overflow-y:auto}
.sheet .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#BDBDBD}
.sheet h2{margin:0;font-size:32px;line-height:1.05;font-weight:500;letter-spacing:-.035em}
.sheet p{margin:0;font-size:15px;line-height:1.4;color:#3D3D3D}
.sheet .thumbs{display:flex;gap:6px;flex-wrap:wrap}
.sheet .thumbs span{width:56px;height:56px;border-radius:28px;background:#fff;overflow:hidden}
.sheet .thumbs img{width:100%;height:100%;object-fit:cover}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lb{font-size:12px;color:var(--muted)}
.field input{width:100%;height:52px;border-radius:26px;border:0;background:#fff;padding:0 20px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.field input:focus{box-shadow:0 0 0 2px var(--ink)}
.wrapline{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:22px;font-size:14px;z-index:40;max-width:90vw}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted);padding:24px}
.center b{font-size:28px;color:var(--ink);font-weight:500;letter-spacing:-.03em}
.ic{width:18px;height:18px;flex:none}
.sw{display:inline-block;width:10px;height:10px;border-radius:5px;border:1px solid rgba(0,0,0,.18);flex:none}
.sw.print{background:repeating-linear-gradient(45deg,#111 0 2px,#fff 2px 4px)}
.card .row .r{display:flex;align-items:center;gap:4px}
.sec{margin:22px 0 0;font-size:13px;color:var(--muted)}
.colors{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{height:40px;padding:0 14px 0 10px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px}
.chip .sw{width:18px;height:18px;border-radius:9px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .sw{border-color:#fff}
.trow{display:flex;align-items:center;gap:10px;margin-top:6px}
.trow .title{margin:0;flex:1;min-width:0}
.round.sm{width:40px;height:40px;border-radius:20px}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;height:52px;border-radius:26px;border:0;background:#fff;padding:0 20px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.addrow .pill{height:52px;border-radius:26px}
.dd{margin-top:18px;background:var(--card);border-radius:22px;overflow:hidden}
.dd-h{width:100%;min-height:56px;padding:0 18px;display:flex;align-items:center;gap:10px;font-size:15px}
.dd-h .lbl{font-size:13px;color:var(--muted)}
.dd-h .val{flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-h .chev{transition:transform .2s;flex:none}
.dd.open .dd-h .chev{transform:rotate(180deg)}
.dd-i{width:100%;height:50px;padding:0 18px;display:flex;align-items:center;gap:12px;font-size:15px;border-top:1px solid #EEEEEE}
.dd-i .ck{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.dd-i.on .ck{background:var(--ink);border-color:var(--ink);color:#fff}
.dd-i .nm{flex:1}
.dd-i .sw{width:20px;height:20px;border-radius:10px}
.linkbtn{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка…</div></div>

<script>
(function () {
  // ===================== настройки =====================
  var API = 'https://zrhpfkedycaqsruiihlc.supabase.co/functions/v1/app';
  var qs = new URLSearchParams(location.search);
  var BOT = (qs.get('bot') || 'samalisstyle_bot').replace(/^@/, '').toLowerCase();
  var COLORS = [
    { k: 'black', name: 'Чёрный', hex: '#111111' }, { k: 'white', name: 'Белый', hex: '#FFFFFF' },
    { k: 'grey', name: 'Серый', hex: '#9E9E9E' }, { k: 'beige', name: 'Бежевый', hex: '#D8C3A5' },
    { k: 'brown', name: 'Коричневый', hex: '#7B4F2C' }, { k: 'blue', name: 'Синий', hex: '#2F4FA2' },
    { k: 'lightblue', name: 'Голубой', hex: '#9CC3E6' }, { k: 'green', name: 'Зелёный', hex: '#3E7B4F' },
    { k: 'red', name: 'Красный', hex: '#C0392B' }, { k: 'pink', name: 'Розовый', hex: '#E8A0B4' },
    { k: 'print', name: 'Принт', hex: '' }
  ];
  var CMAP = {}; COLORS.forEach(function (c) { CMAP[c.k] = c; });
  function sw(k) { var c = CMAP[k]; if (!c) return ''; return c.k === 'print' ? '<span class="sw print"></span>' : '<span class="sw" style="background:' + c.hex + '"></span>'; }
  var DAY = Math.floor(Date.now() / 864e5);

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#EAEAEA'); tg.setBackgroundColor('#EAEAEA'); } catch (e) {}
  }
  var app = document.getElementById('app');

  // ===================== состояние =====================
  var S = {
    data: null, screen: 'wardrobe', prev: 'wardrobe',
    cat: 'all', itemId: null, sel: [], bcat: 'all',
    lf: 'all', lookId: null, saveOpen: false, lookName: '', lc: 'office',
    confirm: null, busy: false, renameOpen: false, renameVal: '', newCatOpen: false, newCatName: '',
    colorOpen: false, catOpen: false, newItemCatOpen: false, newItemCatName: ''
  };

  // ===================== утилиты =====================
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, f) { var a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]); }
  var W = ['вещь', 'вещи', 'вещей'];
  function haptic(t) { try { tg && tg.HapticFeedback && (t === 'sel' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
  }
  var IC = {
    back: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    close: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>',
    plus: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
    arrow: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chev: '<svg class="ic chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
    edit: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
    trash: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>'
  };

  function api(action, payload) {
    var body = Object.assign({ action: action, bot: BOT, initData: tg ? tg.initData : '' }, payload || {});
    return fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'error'); e.code = r.status; throw e; } return j; }); });
  }

  // ===================== данные =====================
  function D() { return S.data; }
  function isStylist() { return D() && D().role === 'stylist'; }
  function items() { return D().items; }
  function byId(id) { return items().filter(function (i) { return i.id === id; })[0]; }
  function catName(id) { var c = D().categories.filter(function (c) { return c.id === id; })[0]; return c ? c.name : ''; }
  function catsWithItems() { return D().categories.filter(function (c) { return items().some(function (i) { return i.cat === c.id; }); }); }
  function inCat(catId) { return items().filter(function (i) { return catId === 'all' || i.cat === catId; }); }
  function lookCats() { return D().lookCats || []; }
  function lcName(k) { var c = lookCats().filter(function (x) { return x.k === k; })[0]; return c ? c.name : ''; }
  function initials(name) { return String(name || '').split(' ').map(function (w) { return w[0] || ''; }).join('').slice(0, 2).toUpperCase(); }

  // ===================== компоненты =====================
  function covers(active, act, withSel) {
    var list = [{ id: 'all', name: 'Все' }].concat(catsWithItems());
    return '<div class="scroller" data-keep="' + act + '">' + list.map(function (c, idx) {
      var its = inCat(c.id);
      var picked = withSel ? S.sel.filter(function (id) { var i = byId(id); return i && (c.id === 'all' || i.cat === c.id); }).length : 0;
      var cover = c.id === 'all' || !its.length ? '' : its[(DAY + idx) % its.length].thumb;
      return '<button class="cover' + (String(active) === String(c.id) ? ' on' : '') + '" data-a="' + act + '" data-v="' + c.id + '" aria-pressed="' + (String(active) === String(c.id)) + '">' +
        '<span class="ph">' + (c.id === 'all' ? '<b>' + items().length + '</b>' : '<img src="' + esc(cover) + '" alt="" loading="lazy">') + '</span>' +
        '<span class="nm">' + esc(c.name) + '</span>' +
        '<span class="ct">' + (picked ? 'выбрано: ' + picked : plural(its.length, W)) + '</span></button>';
    }).join('') + '</div>';
  }

  function meta(it) {
    return '<span class="meta"><span class="c">' + esc(catName(it.cat)) + '</span>' +
      '<span class="t' + (it.title ? '' : ' empty') + '">' + esc(it.title || 'Без названия') + '</span></span>';
  }

  function itemCard(it) {
    return '<button class="card" data-a="openItem" data-v="' + it.id + '">' +
      '<span class="row"><span>№ ' + it.num + '</span><span class="r">' + (it.colors || []).slice(0, 4).map(sw).join('') + IC.arrow + '</span></span>' +
      '<span class="img"><img src="' + esc(it.thumb) + '" alt="' + esc(it.title || it.code) + '" loading="lazy"></span>' +
      meta(it) + '</button>';
  }

  function tabs() {
    var sec = (S.screen === 'looks' || S.screen === 'look') ? 'looks' : 'wardrobe';
    var t = [{ k: 'wardrobe', n: 'Гардероб' }, { k: 'looks', n: 'Образы', bd: D().looks.length }];
    if (isStylist()) t.push({ k: 'builder', n: 'Собрать' });
    return '<nav class="tabs" aria-label="Разделы">' + t.map(function (x) {
      var on = x.k === sec;
      return '<button class="tab' + (on ? ' on' : '') + '" data-a="go" data-v="' + x.k + '">' + x.n +
        (on && x.bd ? '<span class="bd">' + x.bd + '</span>' : '') + '</button>';
    }).join('') + '</nav>';
  }

  function header(left, right) { return '<div class="top">' + left + (right || '') + '</div>'; }
  function avatar() { return '<span class="round avatar">' + esc(initials(D().client)) + '</span>'; }
  function backBtn(act) { return '<button class="round" data-a="' + (act || 'back') + '" aria-label="Назад">' + IC.back + '</button>'; }

  // ===================== экраны =====================
  function vWardrobe() {
    var list = inCat(S.cat);
    var h = header(avatar());
    h += '<h1 class="h1">Гардероб</h1>';
    h += isStylist()
      ? '<p class="sub">' + esc(D().client) + (D().stylist ? '<br>клиент стилиста ' + esc(D().stylist) : '') + '</p>'
      : '<p class="sub">Ваши вещи' + (D().stylist ? ', собранные<br>стилистом ' + esc(D().stylist) : '') + '</p>';
    h += '<div class="stat"><b>' + items().length + '</b><small>' + plural(items().length, W).replace(/^\d+ /, '') + '<br>в гардеробе</small></div>';
    if (!items().length) return h + '<div class="empty">Пока пусто — вещи появятся, когда стилист загрузит их через бота.</div>';
    h += covers(S.cat, 'cat', false);
    h += '<div class="grid">' + list.map(itemCard).join('') + '</div>';
    if (isStylist() && S.cat !== 'all' && list.length) {
      h += '<button class="btn ghost" style="margin-top:16px" data-a="askDelCat">' + IC.trash + 'Удалить все в категории (' + list.length + ')</button>';
    }
    return h;
  }

  function vItem() {
    var it = byId(S.itemId);
    if (!it) { S.screen = 'wardrobe'; return vWardrobe(); }
    var inLooks = D().looks.filter(function (l) { return l.items.indexOf(it.id) >= 0; }).length;
    var h = header(backBtn(), '<span style="font-size:13px;color:var(--muted)">№ ' + it.num + '</span>');
    h += '<p class="label">' + esc(catName(it.cat)) + '</p>';
    h += '<div class="trow"><h1 class="title">' + esc(it.title || 'Без названия') + '</h1>' +
      (isStylist() ? '<button class="round sm" data-a="openRename" aria-label="Переименовать">' + IC.edit + '</button>' : '') + '</div>';
    h += '<div class="hero"><img src="' + esc(it.photo) + '" alt="' + esc(it.title || it.code) + '"></div>';
    var cs = it.colors || [];
    var cnames = cs.map(function (k) { return CMAP[k] ? CMAP[k].name : ''; }).filter(Boolean).join(', ');
    if (isStylist()) {
      h += '<div class="dd' + (S.colorOpen ? ' open' : '') + '"><button class="dd-h" data-a="toggleColors" aria-expanded="' + S.colorOpen + '">' +
        '<span class="lbl">Цвет</span><span class="val">' + (cnames ? esc(cnames) : 'не выбран') + '</span>' + IC.chev + '</button>' +
        (S.colorOpen ? COLORS.map(function (c) {
          var on = cs.indexOf(c.k) >= 0;
          return '<button class="dd-i' + (on ? ' on' : '') + '" data-a="color" data-v="' + c.k + '" aria-pressed="' + on + '"><span class="ck">' + IC.check + '</span><span class="nm">' + c.name + '</span>' + sw(c.k) + '</button>';
        }).join('') : '') + '</div>';
    } else if (cs.length) {
      h += '<div class="dd"><div class="dd-h"><span class="lbl">Цвет</span><span class="val">' + esc(cnames) + '</span>' + cs.map(sw).join('') + '</div></div>';
    }
    h += '<div class="kv"><div><span>Номер</span><span>' + esc(it.code) + '</span></div>' +
      '<div><span>Категория</span>' + (isStylist() ? '<button class="linkbtn" data-a="openCat">' + esc(catName(it.cat)) + '</button>' : '<span>' + esc(catName(it.cat)) + '</span>') + '</div>' +
      '<div><span>В образах</span><span>' + inLooks + '</span></div></div>';
    if (isStylist()) {
      h += '<button class="btn" style="margin-top:18px" data-a="buildWith" data-v="' + it.id + '">' + IC.plus + 'Собрать образ с этой вещью</button>';
      h += '<button class="btn ghost" style="margin-top:8px" data-a="askDelItem" data-v="' + it.id + '">' + IC.trash + 'Удалить вещь</button>';
    }
    return h;
  }

  function vBuilder() {
    var list = inCat(S.bcat);
    var h = header('<button class="round" data-a="back" aria-label="Закрыть">' + IC.close + '</button>',
      '<button class="pill" style="background:var(--chip);border-color:var(--chip)" data-a="reset">Сбросить</button>');
    h += '<h1 class="h1">Собрать<br><span class="thin">образ</span></h1>';
    h += '<p class="sub">Переходите по категориям и нажимайте<br>«Выбрать» — выбор сохраняется</p>';
    if (!items().length) return h + '<div class="empty">В гардеробе пока нет вещей.</div>';
    h += covers(S.bcat, 'bcat', true);
    h += '<div class="grid">' + list.map(function (it) {
      var on = S.sel.indexOf(it.id) >= 0;
      return '<div class="card' + (on ? ' sel' : '') + '">' +
        '<span class="row"><span>№ ' + it.num + '</span><span class="r">' + (it.colors || []).slice(0, 4).map(sw).join('') + '</span></span>' +
        '<span class="img"><img src="' + esc(it.thumb) + '" alt="" loading="lazy"></span>' + meta(it) +
        '<button class="pick' + (on ? ' on' : '') + '" data-a="toggle" data-v="' + it.id + '" aria-pressed="' + on + '">' +
        (on ? IC.check + 'Выбрано' : 'Выбрать') + '</button></div>';
    }).join('') + '</div>';
    return h;
  }

  function selbar() {
    var th = S.sel.slice(0, 4).map(function (id) { var i = byId(id); return i ? '<span><img src="' + esc(i.thumb) + '" alt=""></span>' : ''; }).join('');
    return '<div class="selbar"><div><small>Собрано</small><b>' + S.sel.length + '</b></div>' +
      '<div class="th">' + th + '</div>' +
      '<button class="go" data-a="openSave"' + (S.sel.length ? '' : ' disabled') + '>Готово</button></div>';
  }

  function vLooks() {
    var looks = D().looks.filter(function (l) { return S.lf === 'all' || l.lc === S.lf; });
    var h = header(avatar(), isStylist() ? '<button class="round dark" data-a="go" data-v="builder" aria-label="Новый образ">' + IC.plus + '</button>' : '');
    h += '<h1 class="h1">Образы</h1>';
    h += '<div class="stat"><b>' + D().looks.length + '</b><small>' + plural(D().looks.length, ['готовый<br>образ', 'готовых<br>образа', 'готовых<br>образов']).replace(/^\d+ /, '') + '</small></div>';
    if (!D().looks.length) {
      return h + '<div class="empty">' + (isStylist() ? 'Образов пока нет. Нажмите «Собрать», чтобы создать первый.' : 'Образов пока нет — стилист скоро их соберёт.') + '</div>';
    }
    h += '<div class="pills">' + [{ k: 'all', name: 'Все' }].concat(lookCats()).map(function (c) {
      var n = c.k === 'all' ? D().looks.length : D().looks.filter(function (l) { return l.lc === c.k; }).length;
      return '<button class="pill' + (S.lf === c.k ? ' on' : '') + '" data-a="lf" data-v="' + c.k + '">' + c.name + '<small>' + n + '</small></button>';
    }).join('') + '</div>';
    h += '<div class="looks">' + (looks.length ? looks.map(function (l, i) {
      var dots = l.items.slice(0, 4).map(function (id) { var it = byId(id); return it ? '<span class="dot"><img src="' + esc(it.thumb) + '" alt="" loading="lazy"></span>' : ''; }).join('');
      return '<button class="look' + (i === 0 ? ' dark' : '') + '" data-a="openLook" data-v="' + l.id + '">' +
        '<span class="hd"><span>' + esc(lcName(l.lc)) + '<br>' + plural(l.items.length, W) + '</span>' + IC.arrow + '</span>' +
        '<span class="dots">' + dots + '</span><span class="nm">' + esc(l.name) + '</span></button>';
    }).join('') : '<div class="empty">В этой категории образов нет.</div>') + '</div>';
    return h;
  }

  function vLook() {
    var l = D().looks.filter(function (x) { return x.id === S.lookId; })[0];
    if (!l) { S.screen = 'looks'; return vLooks(); }
    var h = header(backBtn('toLooks'), '<span style="font-size:13px;color:var(--muted)">' + plural(l.items.length, W) + '</span>');
    h += '<p class="label">' + esc(lcName(l.lc)) + '</p>';
    h += '<div class="trow"><h1 class="h1" style="margin:0;font-size:44px;flex:1;min-width:0">' + esc(l.name) + '</h1>' +
      (isStylist() ? '<button class="round sm" data-a="openEditLook" aria-label="Редактировать образ">' + IC.edit + '</button>' : '') + '</div>';
    if (l.comment) h += '<div class="note"><small>Комментарий стилиста</small><p>' + esc(l.comment) + '</p></div>';
    h += '<div class="grid" style="margin-top:' + (l.comment ? 8 : 20) + 'px">' + l.items.map(function (id) { var it = byId(id); return it ? itemCard(it) : ''; }).join('') + '</div>';
    if (isStylist()) h += '<button class="btn ghost" style="margin-top:16px" data-a="askDelLook" data-v="' + l.id + '">' + IC.trash + 'Удалить образ</button>';
    return h;
  }

  function vSaveSheet() {
    var th = S.sel.map(function (id) { var i = byId(id); return i ? '<span><img src="' + esc(i.thumb) + '" alt=""></span>' : ''; }).join('');
    return '<button class="shade" data-a="closeSave" aria-label="Закрыть"></button>' +
      '<div class="sheet" role="dialog" aria-label="Новый образ"><span class="grab"></span><h2>Новый образ</h2>' +
      '<div class="thumbs">' + th + '</div>' +
      '<div class="field"><label for="lookName">Название</label><input id="lookName" maxlength="60" placeholder="Например, Деловая встреча" value="' + esc(S.lookName) + '"></div>' +
      '<div class="field"><span class="lb">Категория образа</span><div class="wrapline">' + lookCats().map(function (c) {
        return '<button class="pill' + (S.lc === c.k ? ' on' : '') + '" data-a="lc" data-v="' + c.k + '">' + esc(c.name) + '</button>';
      }).join('') + (S.newCatOpen ? '' : '<button class="pill" data-a="newCat">' + IC.plus + 'Новая</button>') + '</div>' +
      (S.newCatOpen ? '<div class="addrow"><input id="newCatName" maxlength="30" placeholder="Например, Отпуск" value="' + esc(S.newCatName) + '"><button class="pill on" data-a="addCat">Добавить</button></div>' : '') + '</div>' +
      '<button class="btn" data-a="save"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Сохраняю…' : 'Сохранить образ') + '</button></div>';
  }

  function vRename() {
    return '<button class="shade" data-a="closeRename" aria-label="Закрыть"></button>' +
      '<div class="sheet" role="dialog" aria-label="Название вещи"><span class="grab"></span><h2>Название вещи</h2>' +
      '<div class="field"><label for="renameInput">Название</label><input id="renameInput" maxlength="80" placeholder="Например, юбка замшевая" value="' + esc(S.renameVal) + '"></div>' +
      '<button class="btn" data-a="saveRename"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Сохраняю…' : 'Сохранить') + '</button>' +
      '<button class="btn plain" data-a="closeRename">Отмена</button></div>';
  }

  function vCat() {
    var it = byId(S.itemId);
    return '<button class="shade" data-a="closeCat" aria-label="Закрыть"></button>' +
      '<div class="sheet" role="dialog" aria-label="Категория вещи"><span class="grab"></span><h2>Категория</h2>' +
      '<div class="wrapline">' + D().categories.map(function (c) {
        return '<button class="pill' + (it && it.cat === c.id ? ' on' : '') + '" data-a="setCat" data-v="' + c.id + '">' + esc(c.name) + '</button>';
      }).join('') + (S.newItemCatOpen ? '' : '<button class="pill" data-a="newItemCat">' + IC.plus + 'Новая категория</button>') + '</div>' +
      (S.newItemCatOpen ? '<div class="addrow"><input id="newItemCatName" class="inp2" maxlength="30" placeholder="Например, Купальники" value="' + esc(S.newItemCatName) + '"><button class="pill on" data-a="addItemCat">Добавить</button></div>' : '') +
      '<button class="btn plain" data-a="closeCat">Закрыть</button></div>';
  }

  function vEditLook() {
    return '<button class="shade" data-a="closeEditLook" aria-label="Закрыть"></button>' +
      '<div class="sheet" role="dialog" aria-label="Редактировать образ"><span class="grab"></span><h2>Образ</h2>' +
      '<div class="field"><label for="elName">Название</label><input id="elName" maxlength="60" placeholder="Название образа" value="' + esc(S.elName) + '"></div>' +
      '<div class="field"><span class="lb">Категория образа</span><div class="wrapline">' + lookCats().map(function (c) {
        return '<button class="pill' + (S.elLc === c.k ? ' on' : '') + '" data-a="elLc" data-v="' + c.k + '">' + esc(c.name) + '</button>';
      }).join('') + (S.newCatOpen ? '' : '<button class="pill" data-a="newCat">' + IC.plus + 'Новая</button>') + '</div>' +
      (S.newCatOpen ? '<div class="addrow"><input id="newCatName" maxlength="30" placeholder="Например, Отпуск" value="' + esc(S.newCatName) + '"><button class="pill on" data-a="addCat">Добавить</button></div>' : '') + '</div>' +
      '<button class="btn" data-a="saveEditLook"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Сохраняю…' : 'Сохранить') + '</button>' +
      '<button class="btn plain" data-a="closeEditLook">Отмена</button></div>';
  }

  function vConfirm() {
    return '<button class="shade" data-a="cancelConfirm" aria-label="Отмена"></button>' +
      '<div class="sheet" role="dialog" aria-label="Подтверждение"><span class="grab"></span><h2>Удалить?</h2>' +
      '<p>' + esc(S.confirm.text) + '</p>' +
      '<button class="btn" data-a="doConfirm"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Удаляю…' : esc(S.confirm.btn)) + '</button>' +
      '<button class="btn plain" data-a="cancelConfirm">Отмена</button></div>';
  }

  // ===================== рендер =====================
  function render() {
    if (!S.data) return;
    var keep = {};
    app.querySelectorAll('[data-keep]').forEach(function (el) { keep[el.dataset.keep] = el.scrollLeft; });
    var v = { wardrobe: vWardrobe, item: vItem, builder: vBuilder, looks: vLooks, look: vLook }[S.screen] || vWardrobe;
    var html = '<main class="wrap">' + v() + '</main>';
    html += S.screen === 'builder' ? selbar() : tabs();
    if (S.saveOpen) html += vSaveSheet();
    if (S.confirm) html += vConfirm();
    if (S.renameOpen) html += vRename();
    if (S.catOpen) html += vCat();
    if (S.elOpen) html += vEditLook();
    app.innerHTML = html;
    app.querySelectorAll('[data-keep]').forEach(function (el) { if (keep[el.dataset.keep]) el.scrollLeft = keep[el.dataset.keep]; });
    var inp = document.getElementById('lookName');
    if (inp) inp.addEventListener('input', function () { S.lookName = inp.value; });
    var ri = document.getElementById('renameInput');
    if (ri) { ri.addEventListener('input', function () { S.renameVal = ri.value; }); }
    var eln = document.getElementById('elName');
    if (eln) { eln.addEventListener('input', function () { S.elName = eln.value; }); }
    var nic = document.getElementById('newItemCatName');
    if (nic) { nic.addEventListener('input', function () { S.newItemCatName = nic.value; }); }
    var nc = document.getElementById('newCatName');
    if (nc) { nc.addEventListener('input', function () { S.newCatName = nc.value; }); }
    if (tg && tg.BackButton) {
      if (S.screen === 'item' || S.screen === 'builder' || S.screen === 'look') tg.BackButton.show(); else tg.BackButton.hide();
    }
  }

  function go(screen, extra) {
    var changed = screen !== S.screen;
    if (changed) S.prev = S.screen;
    Object.assign(S, { screen: screen }, extra || {});
    render();
    if (changed) window.scrollTo(0, 0);
  }

  function reload() {
    return api('load').then(function (d) { S.data = d; render(); });
  }

  // ===================== действия =====================
  var A = {
    go: function (v) { haptic('sel'); go(v); },
    back: function () {
      if (S.saveOpen) { S.saveOpen = false; return render(); }
      if (S.confirm) { S.confirm = null; return render(); }
      if (S.renameOpen) { S.renameOpen = false; return render(); }
      if (S.catOpen) { S.catOpen = false; return render(); }
      if (S.elOpen) { S.elOpen = false; return render(); }
      if (S.screen === 'look') return go('looks');
      go(S.prev && S.prev !== S.screen && S.prev !== 'builder' ? S.prev : 'wardrobe');
    },
    toLooks: function () { go('looks'); },
    cat: function (v) { haptic('sel'); S.cat = v === 'all' ? 'all' : Number(v); render(); },
    bcat: function (v) { haptic('sel'); S.bcat = v === 'all' ? 'all' : Number(v); render(); },
    lf: function (v) { haptic('sel'); S.lf = v; render(); },
    openItem: function (v) { go('item', { itemId: v, colorOpen: false }); },
    toggleColors: function () { S.colorOpen = !S.colorOpen; render(); },
    openCat: function () { S.catOpen = true; S.newItemCatOpen = false; render(); },
    closeCat: function () { S.catOpen = false; render(); },
    newItemCat: function () { S.newItemCatOpen = true; S.newItemCatName = ''; render(); var i = document.getElementById('newItemCatName'); if (i) i.focus(); },
    setCat: function (v) {
      var it = byId(S.itemId); if (!it || S.busy) return;
      if (it.cat === Number(v)) { S.catOpen = false; return render(); }
      S.busy = true;
      api('setItemCategory', { id: it.id, catId: Number(v) }).then(function () {
        S.busy = false; S.catOpen = false;
        return reload().then(function () { haptic(); toast('Категория изменена'); });
      }).catch(function () { S.busy = false; toast('Не получилось изменить категорию'); });
    },
    addItemCat: function () {
      var name = (S.newItemCatName || '').trim(); if (!name || S.busy) return;
      S.busy = true;
      api('addCategory', { name: name }).then(function (r) {
        S.busy = false; S.newItemCatOpen = false; S.newItemCatName = '';
        return reload().then(function () { A.setCat(String(r.id)); });
      }).catch(function () { S.busy = false; toast('Не получилось добавить категорию'); });
    },
    openLook: function (v) { go('look', { lookId: v }); },
    openEditLook: function () {
      var l = D().looks.filter(function (x) { return x.id === S.lookId; })[0]; if (!l) return;
      S.elName = l.name; S.elLc = l.lc; S.newCatOpen = false; S.elOpen = true; render();
    },
    closeEditLook: function () { S.elOpen = false; S.newCatOpen = false; render(); },
    elLc: function (v) { S.elLc = v; render(); },
    saveEditLook: function () {
      if (S.busy) return;
      S.busy = true; render();
      api('updateLook', { id: S.lookId, name: S.elName, lc: S.elLc }).then(function () {
        S.busy = false; S.elOpen = false; S.newCatOpen = false;
        return reload().then(function () { haptic(); toast('Образ обновлён'); });
      }).catch(function () { S.busy = false; render(); toast('Не получилось сохранить'); });
    },
    buildWith: function (v) { if (S.sel.indexOf(v) < 0) S.sel.push(v); go('builder', { bcat: 'all' }); },
    toggle: function (v) {
      haptic('sel');
      var i = S.sel.indexOf(v);
      if (i >= 0) S.sel.splice(i, 1); else S.sel.push(v);
      render();
    },
    reset: function () { S.sel = []; S.lookName = ''; render(); },
    openSave: function () { if (S.sel.length) { S.saveOpen = true; render(); } },
    closeSave: function () { S.saveOpen = false; S.newCatOpen = false; render(); },
    lc: function (v) { S.lc = v; render(); },
    save: function () {
      if (S.busy || !S.sel.length) return;
      S.busy = true; render();
      api('saveLook', { name: S.lookName, lc: S.lc, items: S.sel }).then(function (r) {
        S.busy = false; S.saveOpen = false; S.sel = []; S.lookName = ''; S.lf = 'all';
        return reload().then(function () { haptic(); toast('Образ сохранён'); go('look', { lookId: r.id }); });
      }).catch(function () { S.busy = false; render(); toast('Не получилось сохранить, попробуйте ещё раз'); });
    },
    askDelItem: function (v) {
      var it = byId(v);
      S.confirm = { kind: 'item', id: v, text: 'Удалить «' + (it.title || it.code) + '»? Фото удалится из хранилища, вещь пропадёт из всех образов.', btn: 'Удалить вещь' };
      render();
    },
    askDelCat: function () {
      var n = inCat(S.cat).length;
      S.confirm = { kind: 'cat', id: S.cat, text: 'Удалить все вещи категории «' + catName(S.cat) + '» (' + n + ')? Фото удалятся из хранилища, вещи пропадут из образов. Отменить нельзя.', btn: 'Удалить ' + plural(n, W) };
      render();
    },
    askDelLook: function (v) {
      var l = D().looks.filter(function (x) { return x.id === v; })[0];
      S.confirm = { kind: 'look', id: v, text: 'Удалить образ «' + (l ? l.name : '') + '»? Сами вещи останутся в гардеробе.', btn: 'Удалить образ' };
      render();
    },
    cancelConfirm: function () { S.confirm = null; render(); },
    openRename: function () { var it = byId(S.itemId); S.renameVal = it ? it.title : ''; S.renameOpen = true; render(); var i = document.getElementById('renameInput'); if (i) i.focus(); },
    closeRename: function () { S.renameOpen = false; render(); },
    saveRename: function () {
      var it = byId(S.itemId); if (!it || S.busy) return;
      S.busy = true; render();
      api('renameItem', { id: it.id, title: S.renameVal }).then(function (r) {
        it.title = r.title; S.busy = false; S.renameOpen = false; render(); haptic(); toast('Название сохранено');
      }).catch(function () { S.busy = false; render(); toast('Не получилось сохранить'); });
    },
    color: function (v) {
      var it = byId(S.itemId); if (!it) return;
      haptic('sel');
      var prev = (it.colors || []).slice();
      var i = prev.indexOf(v);
      it.colors = i >= 0 ? prev.filter(function (x) { return x !== v; }) : prev.concat([v]);
      render();
      api('setColors', { id: it.id, colors: it.colors }).catch(function () { it.colors = prev; render(); toast('Не получилось сохранить цвет'); });
    },
    newCat: function () { S.newCatOpen = true; S.newCatName = ''; render(); var i = document.getElementById('newCatName'); if (i) i.focus(); },
    addCat: function () {
      var name = (S.newCatName || '').trim(); if (!name || S.busy) return;
      S.busy = true;
      api('addLookCat', { name: name }).then(function (r) {
        S.busy = false; S.newCatOpen = false; S.newCatName = ''; if (S.elOpen) S.elLc = r.key; else S.lc = r.key;
        return reload().then(function () { haptic(); toast('Категория добавлена'); });
      }).catch(function () { S.busy = false; toast('Не получилось добавить категорию'); });
    },
    doConfirm: function () {
      var c = S.confirm; if (!c || S.busy) return;
      S.busy = true; render();
      var call = c.kind === 'item' ? api('deleteItem', { id: c.id })
        : c.kind === 'cat' ? api('deleteCategory', { catId: c.id })
        : api('deleteLook', { id: c.id });
      call.then(function () {
        S.busy = false; S.confirm = null;
        if (c.kind === 'item') S.sel = S.sel.filter(function (x) { return x !== c.id; });
        return reload().then(function () {
          haptic(); toast('Удалено');
          if (c.kind === 'look') go('looks'); else go('wardrobe', { cat: c.kind === 'cat' ? 'all' : S.cat });
        });
      }).catch(function () { S.busy = false; render(); toast('Не получилось удалить'); });
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var fn = A[el.dataset.a];
    if (fn) fn(el.dataset.v);
  });
  if (tg && tg.BackButton) tg.BackButton.onClick(function () { A.back(); });

  // ===================== старт =====================
  if (!tg || !tg.initData) {
    app.innerHTML = '<div class="center"><b>Гардероб</b>Откройте приложение из Telegram-бота — кнопка «Гардероб» внизу чата.</div>';
    return;
  }
  reload().catch(function (e) {
    var msg = e.code === 403 ? 'Это приватный гардероб. Доступ открывается по приглашению стилиста.'
      : e.code === 401 ? 'Не удалось подтвердить вход. Закройте и откройте приложение снова.'
      : 'Не получилось загрузить гардероб. Проверьте интернет и попробуйте ещё раз.';
    app.innerHTML = '<div class="center"><b>Гардероб</b>' + esc(msg) + '</div>';
  });
})();
</script>
</body>
</html>
